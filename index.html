<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#b425aa" />
  <title>Cognitio+</title>
  <link rel="manifest" href="#manifest-placeholder" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%23b425aa%22>C</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    const manifest = {
      "name": "Cognitio+",
      "short_name": "Cognitio",
      "start_url": "/",
      "display": "standalone",
      "background_color": "#f8f9fa",
      "theme_color": "#b425aa",
      "icons": [
        {
          "src": "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 fill=%22%23b425aa%22>C</text></svg>",
          "sizes": "192x192",
          "type": "image/svg+xml"
        }
      ]
    };
    const blob = new Blob([JSON.stringify(manifest, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = url;
    document.head.appendChild(link);
  </script>
  <style>
    :root {
      --cognitio-primary: #b425aa;
      --cognitio-purple: #c80ec9;
      --cognitio-gold: #D4AF37;
      --cognitio-neutral: #f8f9fa;
    }
    body {
      font-family: 'Roboto Condensed', sans-serif;
      background-color: var(--cognitio-neutral);
      color: #334155;
      margin: 0;
      padding: 0;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Poppins', sans-serif;
    }
    .brand-font {
      font-family: 'Montserrat', sans-serif;
    }
    .oswald-font {
      font-family: 'Oswald', sans-serif;
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .bar-graph {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 60px;
    }
    .bar {
      flex: 1;
      background: #e2e8f0;
      border-radius: 2px;
      transition: height 0.5s ease;
    }
    .bar.active {
      background: #b425aa;
    }
    .breathing-circle {
      width: 150px;
      height: 150px;
      background-color: #c80ec9;
      border-radius: 50%;
      transition: all 1s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      box-shadow: 0 0 20px rgba(180, 37, 170, 0.5);
    }
    .breathing-circle.breathe-in {
      transform: scale(1.3);
      background-color: #b425aa;
    }
    .breathing-circle.breathe-out {
      transform: scale(0.8);
      background-color: #c80ec9;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // --- ICONS ---
    const ICONS = {
      logo: 'https://placehold.co/48x48/b425aa/ffffff?text=C+',
      headerIcon: 'https://appimize.app/assets/apps/user_1097/images/b2e254093bca_935_1097.png',
      resilience: 'https://appimize.app/assets/apps/user_1097/images/dd6354df082d_732_1097.png',
      habit: 'https://appimize.app/assets/apps/user_1097/images/242b9a310e78_285_1097.png',
      wellbe: 'https://appimize.app/assets/apps/user_1097/images/5bf48e1b6187_63_1097.png',
      cognitioPlus: 'https://appimize.app/assets/apps/user_1097/images/265156b5d733_359_1097.png',
      partner: 'https://appimize.app/assets/apps/user_1097/images/d2e70ec09200_94_1097.png',
      rooted: 'https://appimize.app/assets/apps/user_1097/images/bfbcbeb7bb69_808_1097.png',
      awareness: 'https://appimize.app/assets/apps/user_1097/images/ee4a29071876_35_1097.png',
      technology: 'https://appimize.app/assets/apps/user_1097/images/a00e6e94af97_251_1097.png',
      emotion: 'https://appimize.app/assets/apps/user_1097/images/1fbf3fc9faa2_81_1097.png',
      oasis: 'https://appimize.app/assets/apps/user_1097/images/30eb29593783_604_1097.png',
      growth: 'https://appimize.app/assets/apps/user_1097/images/2d5cb5dadead_225_1097.png',
      psych: 'https://appimize.app/assets/apps/user_1097/images/bae59281d566_404_1097.png',
    };

    // --- MOCK USER ---
    const MOCK_USER = {
      id: 'user-123',
      name: 'Alex Rivera',
      email: 'alex.r@cognitio.com',
      userType: 'individual',
      language: 'en',
      region: 'PH',
      goals: ['Improve Sleep', 'Reduce Anxiety'],
      vulnerabilities: ['Stress', 'Burnout'],
      onboardingCompleted: false,
      profile: { occupation: 'Software Engineer', age: 32, bio: 'Focused on growth and mental resilience.' },
      gamification: {
        level: 5, xp: 560, badges: ['Mindful Mover', 'Resilience Rookie'],
        streaks: { meditation: 14 },
        achievements: ['First Log', '10-Day Streak'],
      }
    };

    // --- STATE ---
    let state = {
      user: null,
      currentView: 'home',
      isMenuOpen: false
    };

    const setState = (newState) => {
      state = { ...state, ...newState };
      render();
    };

    // --- UTILS ---
    const createElement = (tag, props = {}, ...children) => {
      const el = document.createElement(tag);
      Object.entries(props).forEach(([key, value]) => {
        if (key.startsWith('on')) {
          el.addEventListener(key.slice(2).toLowerCase(), value);
        } else if (key === 'className') {
          el.className = value;
        } else if (key === 'style') {
          Object.assign(el.style, value);
        } else {
          el.setAttribute(key, value);
        }
      });
      children.flat().forEach(child => {
        if (typeof child === 'string') el.appendChild(document.createTextNode(child));
        else if (child) el.appendChild(child);
      });
      return el;
    };

    const Button = ({ className = '', variant = 'primary', onClick, children, disabled = false }) => {
      const base = "px-4 py-2 rounded-lg font-medium transition-all duration-200 flex items-center justify-center gap-2";
      const variants = {
        primary: "bg-[#b425aa] text-white hover:bg-[#9d1f94] shadow-md hover:shadow-lg",
        outline: "border border-gray-300 bg-white text-gray-700 hover:bg-gray-50",
        ghost: "text-gray-600 hover:bg-gray-100",
        danger: "bg-red-500 text-white hover:bg-red-600 shadow-md",
        gold: "bg-[#D4AF37] text-white hover:bg-[#b8962e] shadow-md"
      };
      return createElement('button', {
        className: `${base} ${variants[variant]} ${className}`,
        onClick,
        disabled
      }, children);
    };

    const Card = ({ className = '', children }) =>
      createElement('div', { className: `bg-white rounded-2xl shadow-sm border border-gray-100 ${className}` }, children);

    const Input = ({ className = '', ...props }) =>
      createElement('input', {
        className: `w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#b425aa] focus:border-transparent ${className}`,
        ...props
      });

    const Label = ({ children, className = '' }) =>
      createElement('label', { className: `block text-sm font-medium text-gray-700 mb-1 ${className}` }, children);

    const Switch = ({ checked, onToggle }) =>
      createElement('button', {
        onClick: () => onToggle(!checked),
        className: `w-11 h-6 rounded-full transition-colors relative ${checked ? 'bg-[#b425aa]' : 'bg-gray-200'}`
      }, createElement('div', {
        className: `w-5 h-5 bg-white rounded-full absolute top-0.5 transition-transform ${checked ? 'translate-x-full left-0.5' : 'left-0.5'}`
      }));

    const Badge = ({ children, variant = 'default', className = '' }) => {
      const styles = {
        default: "bg-gray-100 text-gray-800",
        success: "bg-green-100 text-green-800",
        warning: "bg-yellow-100 text-yellow-800",
        danger: "bg-red-100 text-red-800",
        purple: "bg-purple-100 text-purple-800"
      };
      return createElement('span', {
        className: `px-2.5 py-0.5 rounded-full text-xs font-medium ${styles[variant]} ${className}`
      }, children);
    };

    const GreetingMessage = ({ name }) => {
      const now = new Date();
      let greeting, message, icon;
      const hour = now.getHours();
      if (hour < 12) { greeting = "Good morning"; message = "Start your day with mindfulness."; icon = "🌅"; }
      else if (hour < 18) { greeting = "Good afternoon"; message = "Hope your day is going well."; icon = "☀️"; }
      else { greeting = "Good evening"; message = "Time to wind down and relax."; icon = "🌙"; }
      return createElement('div', { className: 'mb-6 text-white' },
        createElement('div', { className: 'flex items-center gap-2 mb-2' },
          createElement('h2', { className: 'text-3xl font-bold' }, `${greeting}, ${name}! ${icon}`)
        ),
        createElement('p', { className: 'text-purple-100 font-medium' }, message)
      );
    };

    // --- VIEWS ---
    const HomeView = () => {
      const ValuePropositionSection = () => {
        const propositions = [
          { title: 'Cognitio+', icon: ICONS.cognitioPlus },
          { title: 'Your Partner in Resilience', icon: ICONS.partner },
          { title: 'Rooted in Culture', icon: ICONS.rooted },
          { title: 'Powered by Awareness', icon: ICONS.awareness },
          { title: 'Enhanced by Technology', icon: ICONS.technology },
        ];
        return createElement('div', { className: 'w-full -mx-4 sm:-mx-6 lg:-mx-8 bg-white border-b-4 border-[#D4AF37]' },
          createElement('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8' },
            createElement('div', { className: 'text-center mb-8' },
              createElement('h2', { className: 'text-xl md:text-2xl font-semibold text-gray-800 italic leading-relaxed' },
                '"Our mission is to empower local communities to integrate mental health and substance abuse services to primary healthcare."'
              )
            ),
            createElement('div', { className: 'flex flex-wrap justify-center gap-4 md:gap-8 mb-8' },
              ...propositions.map((prop, i) =>
                createElement('div', { className: 'flex items-center gap-2 text-sm md:text-base font-medium text-gray-600 flex-shrink-0', key: i },
                  createElement('img', { src: prop.icon, alt: prop.title, className: 'w-6 h-6 object-contain' }),
                  prop.title
                )
              )
            ),
            createElement('div', { className: 'flex justify-center gap-4' },
              Button({ variant: 'primary', className: 'text-lg px-6 py-3', onClick: () => setState({ user: { ...MOCK_USER, onboardingCompleted: false }, currentView: 'onboarding' }) }, 'Begin Your Journey'),
              Button({ variant: 'outline', className: 'text-lg px-6 py-3', onClick: () => setState({ user: { ...MOCK_USER, onboardingCompleted: false }, currentView: 'onboarding' }) }, 'Login')
            )
          )
        );
      };

      const StatsInfographic = () =>
        createElement('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-6 py-8 px-4 w-full max-w-6xl mx-auto' },
          createElement('div', { className: 'bg-white p-6 rounded-2xl shadow-xl border-2 border-red-100 flex flex-col items-center text-center transition-shadow hover:shadow-2xl md:col-span-1' },
            createElement('div', { className: 'w-12 h-12 bg-purple-100 text-[#b425aa] rounded-full flex items-center justify-center mb-4' }, createElement('i', { 'data-lucide': 'users' })),
            createElement('h3', { className: 'oswald-font text-4xl font-bold text-gray-900 mb-2' }, '1 in 5'),
            createElement('p', { className: 'text-gray-500 text-sm' }, 'Adults experience mental illness each year.')
          ),
          createElement('div', { className: 'bg-white p-6 rounded-2xl shadow-xl border-2 border-red-100 flex flex-col items-center text-center transition-shadow hover:shadow-2xl md:col-span-1' },
            createElement('div', { className: 'w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-4' }, createElement('i', { 'data-lucide': 'trending-up' })),
            createElement('h3', { className: 'oswald-font text-4xl font-bold text-gray-900 mb-2' }, '60%'),
            createElement('p', { className: 'text-gray-500 text-sm' }, 'Of people with mental health conditions go untreated.')
          ),
          createElement('div', { className: 'bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center text-center transition-shadow hover:shadow-lg hidden md:flex' },
            createElement('div', { className: 'w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-4' }, createElement('i', { 'data-lucide': 'award' })),
            createElement('h3', { className: 'oswald-font text-4xl font-bold text-gray-900 mb-2' }, '4x'),
            createElement('p', { className: 'text-gray-500 text-sm' }, 'Improvement in resilience with regular practice.')
          )
        );

      const FeatureShowcase = () => {
        const features = [
          { title: "Resilience Navigator", desc: "Build strength with CASE Framework.", iconUrl: ICONS.resilience, view: 'resilience-navigator' },
          { title: "Habit Design Studio", desc: "Create lasting habits with B=MAP.", iconUrl: ICONS.habit, view: 'habit-studio' },
          { title: "Well-Be Monitor", desc: "Track physiological stress via HRV.", iconUrl: ICONS.wellbe, view: 'well-be' },
          { title: "Emotion Tracker", desc: "Understand feelings with Hawkins Scale.", iconUrl: ICONS.emotion, view: 'emotion-tracker' },
          { title: "Oasis Sanctuary", desc: "Find peace with guided mindfulness.", iconUrl: ICONS.oasis, view: 'oasis' },
          { title: "Psychological Assessment", desc: "Gain deep self-insight with validated tools.", iconUrl: ICONS.psych, view: 'psych-assess' },
        ];
        return createElement('div', { className: 'py-12 max-w-6xl mx-auto px-4' },
          createElement('h2', { className: 'text-3xl font-bold text-center mb-10 brand-font text-gray-800' }, 'Comprehensive Wellness Tools'),
          createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8' },
            ...features.map((feat, i) =>
              Card({ className: 'p-6 transition-all duration-300 hover:shadow-lg cursor-pointer flex flex-col h-full', onClick: () => setState({ currentView: feat.view }) },
                createElement('div', { className: 'flex items-center gap-4 mb-4' },
                  createElement('img', { src: feat.iconUrl, alt: feat.title, className: 'w-10 h-10 object-contain flex-shrink-0' }),
                  createElement('h4', { className: 'font-bold text-xl text-gray-800' }, feat.title)
                ),
                createElement('p', { className: 'text-gray-600 text-sm leading-relaxed flex-grow' }, feat.desc),
                createElement('div', { className: 'mt-4 pt-2 border-t border-gray-50' },
                  createElement('span', { className: 'text-sm text-[#b425aa] flex items-center gap-1 font-medium' }, 'Explore', createElement('i', { 'data-lucide': 'arrow-right', className: 'w-3.5 h-3.5' }))
                )
              )
            )
          )
        );
      };

      return createElement('div', { className: 'flex flex-col items-center -mt-8' },
        ValuePropositionSection(),
        StatsInfographic(),
        createElement('div', { className: 'bg-[#b425aa] w-full -mx-4 sm:-mx-6 lg:-mx-8 p-10 md:p-16 rounded-3xl shadow-2xl mt-8' },
          createElement('div', { className: 'max-w-4xl mx-auto text-center' },
            createElement('div', { className: 'flex items-center justify-center mb-4' },
              createElement('img', { src: ICONS.headerIcon, className: 'w-16 h-16 object-contain' })
            ),
            createElement('h1', { className: 'text-5xl md:text-6xl font-extrabold brand-font text-white mb-4 leading-tight' },
              'Empowering Your ', createElement('span', { className: 'text-[#D4AF37]' }, 'Inner Resilience')
            ),
            createElement('p', { className: 'text-xl text-purple-100 mb-8 font-medium' },
              'Cognitio is the unified platform for mental health and psychological growth.'
            ),
            Button({ variant: 'gold', className: 'text-lg px-8 py-3', onClick: () => setState({ user: { ...MOCK_USER, onboardingCompleted: false }, currentView: 'onboarding' }) },
              'Start Your 7-Day Free Trial', createElement('i', { 'data-lucide': 'chevron-right', className: 'w-4 h-4' })
            )
          )
        ),
        FeatureShowcase(),
        createElement('div', { className: 'mt-12 w-full max-w-6xl bg-gray-50 p-10 rounded-2xl text-center' },
          createElement('h3', { className: 'text-2xl font-bold text-gray-700 mb-4' }, 'Ready to transform your well-being?'),
          createElement('p', { className: 'text-gray-600 mb-6' }, 'Join thousands of individuals and professionals using Cognitio+.'),
          Button({ variant: 'primary', className: 'px-6 py-2.5', onClick: () => setState({ user: { ...MOCK_USER, onboardingCompleted: false }, currentView: 'onboarding' }) }, 'Sign Up Now')
        )
      );
    };

    const OnboardingView = () => {
      const [step, setStep] = useState(1);
      const [goals, setGoals] = useState([]);
      const [vulnerabilities, setVulnerabilities] = useState([]);
      const totalSteps = 4;
      const GOAL_OPTIONS = ['Improve Sleep', 'Reduce Anxiety', 'Build Resilience', 'Increase Focus', 'Better Relationships'];
      const VULNERABILITY_OPTIONS = ['Stress', 'Burnout', 'Isolation', 'Procrastination', 'Low Mood'];

      const handleNext = () => {
        if (step < totalSteps) setStep(step + 1);
        else {
          setState({
            user: { ...state.user, goals, vulnerabilities, onboardingCompleted: true },
            currentView: 'dashboard'
          });
        }
      };

      const handleToggleSelection = (list, setList, item) => {
        if (list.includes(item)) setList(list.filter(g => g !== item));
        else setList([...list, item]);
      };

      const renderStep = () => {
        switch (step) {
          case 1:
            return createElement('div', { className: 'text-center' },
              createElement('img', { src: ICONS.headerIcon, className: 'w-12 h-12 object-contain mx-auto' }),
              createElement('h2', { className: 'text-3xl font-bold text-gray-800 mb-2 mt-4' }, `Welcome, ${state.user.name}!`),
              createElement('p', { className: 'text-gray-600 mb-8' }, `Let's set up your personal journey in ${totalSteps} quick steps.`)
            );
          case 2:
            return createElement('div', null,
              createElement('div', { className: 'flex items-center gap-3 mb-4' },
                createElement('img', { src: ICONS.headerIcon, className: 'w-8 h-8 object-contain' }),
                createElement('h3', { className: 'text-2xl font-bold text-gray-800' }, 'What are your primary goals?')
              ),
              createElement('p', { className: 'text-gray-600 mb-6' }, 'Select up to three areas you want to improve.'),
              ...GOAL_OPTIONS.map(goal =>
                Button({
                  key: goal,
                  variant: goals.includes(goal) ? 'primary' : 'outline',
                  onClick: () => handleToggleSelection(goals, setGoals, goal),
                  className: `disabled:opacity-50 ${goals.includes(goal) ? 'flex items-center gap-1' : ''}`,
                  disabled: !goals.includes(goal) && goals.length >= 3
                }, goals.includes(goal) ? createElement('i', { 'data-lucide': 'check', className: 'w-4 h-4' }) : createElement('i', { 'data-lucide': 'target', className: 'w-4 h-4' }), goal)
              ),
              goals.length === 0 && createElement('p', { className: 'text-sm text-yellow-600 mt-4' },
                createElement('i', { 'data-lucide': 'alert-triangle', className: 'text-yellow-500 inline mr-2 w-4 h-4' }),
                'Please select at least one goal to proceed.'
              )
            );
          case 3:
            return createElement('div', null,
              createElement('div', { className: 'flex items-center gap-3 mb-4' },
                createElement('img', { src: ICONS.headerIcon, className: 'w-8 h-8 object-contain' }),
                createElement('h3', { className: 'text-2xl font-bold text-gray-800' }, 'What are your common vulnerabilities?')
              ),
              createElement('p', { className: 'text-gray-600 mb-6' }, 'Understanding them helps us tailor your content.'),
              ...VULNERABILITY_OPTIONS.map(v =>
                Button({
                  key: v,
                  variant: vulnerabilities.includes(v) ? 'primary' : 'outline',
                  onClick: () => handleToggleSelection(vulnerabilities, setVulnerabilities, v),
                  className: vulnerabilities.includes(v) ? 'flex items-center gap-1' : ''
                }, vulnerabilities.includes(v) ? createElement('i', { 'data-lucide': 'check', className: 'w-4 h-4' }) : createElement('i', { 'data-lucide': 'alert-circle', className: 'w-4 h-4' }), v)
              ),
              vulnerabilities.length === 0 && createElement('p', { className: 'text-sm text-yellow-600 mt-4' },
                createElement('i', { 'data-lucide': 'alert-triangle', className: 'text-yellow-500 inline mr-2 w-4 h-4' }),
                'Selection optional, but recommended.'
              )
            );
          case 4:
            return createElement('div', { className: 'text-center' },
              createElement('img', { src: ICONS.headerIcon, className: 'w-12 h-12 object-contain mx-auto' }),
              createElement('h2', { className: 'text-3xl font-bold text-gray-800 mb-2 mt-4' }, 'Setup Complete!'),
              createElement('p', { className: 'text-gray-600 mb-8' }, 'You are ready to start your journey. We\'ve customized your dashboard based on your goals.'),
              createElement('div', { className: 'flex justify-center flex-wrap gap-2' },
                Badge({ variant: 'purple' }, goals.join(', ')),
                vulnerabilities.length > 0 && Badge({ variant: 'warning' }, `Vulnerabilities: ${vulnerabilities.join(', ')}`)
              )
            );
          default: return null;
        }
      };

      const isNextDisabled = step === 2 && goals.length === 0;

      return Card({ className: 'max-w-lg mx-auto p-8 shadow-xl' },
        createElement('div', { className: 'flex justify-between items-center mb-6' },
          createElement('h1', { className: 'text-xl font-bold text-gray-800' }, `Step ${step}/${totalSteps}`),
          createElement('div', { className: 'w-1/3 bg-gray-200 rounded-full h-1.5' },
            createElement('div', { className: 'h-1.5 bg-[#b425aa] rounded-full transition-all duration-500 ease-in-out', style: { width: `${(step / totalSteps) * 100}%` } })
          )
        ),
        renderStep(),
        createElement('div', { className: 'flex justify-end gap-4 mt-8' },
          step > 1 && Button({ variant: 'ghost', onClick: () => setStep(step - 1) }, createElement('i', { 'data-lucide': 'arrow-left', className: 'w-4 h-4' }), 'Back'),
          Button({ onClick: handleNext, disabled: isNextDisabled },
            step < totalSteps
              ? [createElement('span', null, 'Next Step'), createElement('i', { 'data-lucide': 'chevron-right', className: 'w-4 h-4' })]
              : [createElement('span', null, 'Go to Dashboard'), createElement('i', { 'data-lucide': 'zap', className: 'w-4 h-4' })]
          )
        )
      );
    };

    const DashboardView = () => {
      const { level, xp, badges, streaks } = state.user.gamification;
      const quickLinks = [
        { title: "Track Emotion", view: 'emotion-tracker', icon: 'smile', color: "text-red-500", bg: "bg-red-50" },
        { title: "Start Meditation", view: 'oasis', icon: 'music', color: "text-green-500", bg: "bg-green-50" },
        { title: "Design Habit", view: 'habit-studio', icon: 'target', color: "text-blue-500", bg: "bg-blue-50" },
        { title: "Check Vitality", view: 'well-be', icon: 'droplet', color: "text-purple-500", bg: "bg-purple-50" },
      ];

      const WellBeingChart = () => {
        const data = [10, 30, 50, 45, 20, 60, 35];
        const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        return createElement('div', null,
          createElement('h4', { className: 'text-lg font-semibold mb-3 text-gray-700' }, 'Daily Energy Score'),
          createElement('div', { className: 'bar-graph' },
            ...data.map((h, i) =>
              createElement('div', {
                key: i,
                className: `bar ${i === data.length - 1 ? 'active' : ''}`,
                style: { height: `${h}px` },
                title: `${days[i]}: ${h} points`
              })
            )
          ),
          createElement('div', { className: 'flex justify-between text-xs text-gray-500 mt-1' },
            ...days.map(d => createElement('span', { key: d, className: 'flex-1 text-center' }, d))
          )
        );
      };

      return createElement('div', null,
        createElement('div', { className: 'flex items-center gap-3 mb-8 pb-4 border-b-2 border-[#b425aa]/10' },
          createElement('img', { src: ICONS.headerIcon, className: 'w-12 h-12 object-contain' }),
          createElement('h1', { className: 'text-4xl font-extrabold brand-font text-[#b425aa]' }, 'Your Dashboard')
        ),
        GreetingMessage({ name: state.user.name }),
        createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-3 gap-6' },
          createElement('div', { className: 'lg:col-span-2 space-y-6' },
            Card({ className: 'p-5' },
              createElement('h3', { className: 'text-xl font-bold mb-4 text-gray-800' }, 'Quick Actions'),
              createElement('div', { className: 'grid grid-cols-2 sm:grid-cols-4 gap-4' },
                ...quickLinks.map((link, i) =>
                  Button({
                    key: i,
                    variant: 'outline',
                    className: `flex-col h-24 p-2 ${link.bg}`,
                    onClick: () => setState({ currentView: link.view })
                  },
                    createElement('i', { 'data-lucide': link.icon, className: `w-6 h-6 ${link.color}` }),
                    createElement('span', { className: 'text-xs font-semibold text-gray-700 mt-1' }, link.title)
                  )
                )
              )
            ),
            Card({ className: 'p-6' },
              createElement('div', { className: 'flex justify-between items-center mb-4' },
                createElement('h3', { className: 'text-xl font-bold text-gray-800' }, 'My Goals'),
                Button({ variant: 'ghost', className: 'text-sm' }, 'Manage', createElement('i', { 'data-lucide': 'chevron-right', className: 'w-3.5 h-3.5' }))
              ),
              ...state.user.goals.map((goal, i) =>
                createElement('div', { key: i, className: 'flex flex-col mt-4' },
                  createElement('div', { className: 'flex justify-between items-center mb-1' },
                    createElement('span', { className: 'font-medium text-gray-700' }, goal),
                    Badge({ variant: 'purple' }, '50% Complete')
                  ),
                  createElement('div', { className: 'w-full bg-gray-200 rounded-full h-2' },
                    createElement('div', { className: 'h-2 bg-[#b425aa] rounded-full', style: { width: '50%' } })
                  )
                )
              )
            )
          ),
          createElement('div', { className: 'space-y-6' },
            Card({ className: 'p-6 text-center bg-[#b425aa] text-white' },
              createElement('div', { className: 'flex items-center justify-center mb-3' },
                createElement('i', { 'data-lucide': 'zap', className: 'text-[#D4AF37] w-8 h-8 mr-2' }),
                createElement('h3', { className: 'text-2xl font-bold' }, `Level ${level}`)
              ),
              createElement('p', { className: 'text-sm font-medium text-purple-100 mb-4' }, `${xp} XP to next level`),
              createElement('div', { className: 'w-full bg-purple-600 rounded-full h-2.5' },
                createElement('div', { className: 'h-2.5 bg-[#D4AF37] rounded-full', style: { width: `${(xp % 100)}%` } })
              ),
              createElement('div', { className: 'flex justify-between text-xs mt-2 text-purple-100' },
                createElement('span', null, `Current XP: ${xp}`),
                createElement('span', null, `Next Level: ${level * 100} XP`)
              )
            ),
            Card({ className: 'p-6' },
              WellBeingChart(),
              Button({ variant: 'outline', className: 'w-full mt-4', onClick: () => setState({ currentView: 'well-be' }) }, 'Detailed Vitality Report')
            ),
            Card({ className: 'p-6' },
              createElement('h3', { className: 'text-xl font-bold mb-4 text-gray-800' }, 'Active Streaks'),
              ...Object.entries(streaks).map(([key, value]) =>
                createElement('div', { key, className: 'flex items-center justify-between p-3 bg-gray-50 rounded-lg mt-3' },
                  createElement('span', { className: 'text-sm font-medium capitalize flex items-center gap-2' },
                    createElement('i', { 'data-lucide': 'flame', className: 'text-red-500 w-4 h-4' }),
                    key
                  ),
                  Badge({ variant: 'success' }, `${value} Days`)
                )
              )
            )
          )
        )
      );
    };

    const AppLayout = (children) => {
      const navItems = [
        { name: 'Home', view: 'home', icon: 'home' },
        ...(state.user ? [
          { name: 'Dashboard', view: 'dashboard', icon: 'activity' },
          { name: 'Settings', view: 'settings', icon: 'settings' },
          { name: 'Plans', view: 'subscription-plans', icon: 'dollar-sign' }
        ] : [
          { name: 'Plans', view: 'subscription-plans', icon: 'dollar-sign' }
        ])
      ];

      const handleNavigation = (view) => {
        setState({ currentView: view, isMenuOpen: false });
      };

      const handleLogout = () => {
        setState({ user: null, currentView: 'home', isMenuOpen: false });
      };

      const handleLogin = () => {
        setState({ user: { ...MOCK_USER, onboardingCompleted: false }, currentView: 'onboarding', isMenuOpen: false });
      };

      return createElement('div', { className: 'min-h-screen flex flex-col bg-[#f8f9fa]' },
        createElement('header', { className: 'bg-white border-b border-gray-100 shadow-sm sticky top-0 z-50' },
          createElement('div', { className: 'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between' },
            createElement('div', { className: 'flex items-center gap-2 cursor-pointer', onClick: () => handleNavigation('home') },
              createElement('img', { src: ICONS.headerIcon, className: 'w-8 h-8 object-contain' }),
              createElement('span', { className: 'brand-font font-bold text-xl text-[#b425aa]' }, 'Cognitio', createElement('span', { className: 'text-[#D4AF37]' }, '+'))
            ),
            createElement('div', { className: 'hidden md:flex items-center gap-6' },
              ...navItems.map(item =>
                createElement('button', {
                  key: item.view,
                  onClick: () => handleNavigation(item.view),
                  className: 'text-gray-600 hover:text-[#b425aa] font-medium transition-colors'
                }, item.name)
              ),
              state.user && createElement('div', { className: 'h-6 w-px bg-gray-200' }),
              createElement('div', { className: 'flex items-center gap-3' },
                state.user
                  ? [
                      createElement('div', { className: 'w-8 h-8 rounded-full bg-[#b425aa]/10 text-[#b425aa] flex items-center justify-center font-bold' }, state.user.name.charAt(0).toUpperCase()),
                      createElement('button', { onClick: handleLogout, className: 'text-sm text-red-500 hover:text-red-700 font-medium flex items-center gap-1' },
                        createElement('i', { 'data-lucide': 'log-out', className: 'w-4 h-4' }), ' Sign Out'
                      )
                    ]
                  : Button({ onClick: handleLogin, variant: 'primary', className: 'text-sm' }, 'Login / Sign Up')
              )
            ),
            createElement('button', {
              className: 'md:hidden p-2 text-gray-700',
              onClick: () => setState({ isMenuOpen: !state.isMenuOpen })
            }, state.isMenuOpen ? createElement('i', { 'data-lucide': 'x', className: 'w-6 h-6' }) : createElement('i', { 'data-lucide': 'menu', className: 'w-6 h-6' }))
          ),
          state.isMenuOpen && Card({ className: 'md:hidden bg-white border-t border-gray-100 p-4 shadow-xl absolute w-full z-40 animate-fadeIn' },
            ...navItems.map(item =>
              createElement('button', {
                key: item.view,
                onClick: () => handleNavigation(item.view),
                className: 'text-left text-gray-700 font-medium flex items-center gap-3 p-2 rounded-lg hover:bg-gray-50 w-full'
              },
                createElement('i', { 'data-lucide': item.icon, className: 'text-[#b425aa] w-4.5 h-4.5' }),
                item.name
              )
            ),
            state.user && createElement('button', {
              onClick: handleLogout,
              className: 'text-left text-red-500 font-medium flex items-center gap-3 p-2 rounded-lg hover:bg-red-50/50 w-full mt-2'
            },
              createElement('i', { 'data-lucide': 'log-out', className: 'w-4.5 h-4.5' }), 'Sign Out'
            ),
            !state.user && Button({ onClick: handleLogin, className: 'w-full mt-2' }, 'Login / Sign Up')
          )
        ),
        createElement('main', { className: 'flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fadeIn' }, children),
        createElement('footer', { className: 'bg-white border-t border-gray-200 py-8 mt-auto' },
          createElement('div', { className: 'max-w-7xl mx-auto px-4 text-center' },
            createElement('div', { className: 'flex justify-center mb-4' },
              createElement('img', { src: ICONS.logo, className: 'w-8 h-8 object-contain rounded-full' })
            ),
            createElement('p', { className: 'text-sm text-gray-500 font-["Roboto_Condensed"]' },
              '© 2024 Cognitio Health. All rights reserved. ',
              createElement('br'),
              createElement('span', { className: 'text-[#b425aa] font-bold' }, 'Powered by Awareness, Enhanced by Technology.')
            )
          )
        )
      );
    };

    // --- RENDER ---
    const render = () => {
      if (state.user && !state.user.onboardingCompleted && state.currentView !== 'onboarding') {
        setState({ currentView: 'onboarding' });
        return;
      }

      let view;
      if (!state.user && state.currentView !== 'home' && state.currentView !== 'subscription-plans') {
        view = HomeView();
      } else if (state.user && !state.user.onboardingCompleted) {
        view = OnboardingView();
      } else {
        switch (state.currentView) {
          case 'home': view = HomeView(); break;
          case 'dashboard': view = DashboardView(); break;
          case 'settings':
            view = createElement('div', { className: 'text-center p-8' }, 'Settings View (Placeholder)');
            break;
          case 'resilience-navigator':
          case 'habit-studio':
          case 'well-be':
          case 'emotion-tracker':
          case 'oasis':
          case 'psych-assess':
          case 'subscription-plans':
            view = Card({ className: 'p-8 text-center max-w-2xl mx-auto shadow-xl' },
              createElement('div', { className: 'flex items-center justify-center gap-3 mb-6' },
                createElement('img', { src: ICONS.headerIcon, className: 'w-8 h-8 object-contain' }),
                createElement('h1', { className: 'text-3xl font-bold text-gray-800' }, state.currentView.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '))
              ),
              createElement('p', { className: 'text-gray-600 mb-6' }, 'Feature coming soon!'),
              Button({ variant: 'primary', onClick: () => alert(`Launching ${state.currentView}!`), className: 'w-full mb-4' },
                createElement('i', { 'data-lucide': 'play', className: 'w-4 h-4' }), ' Access Feature'
              ),
              Button({ variant: 'outline', onClick: () => setState({ currentView: 'dashboard' }), className: 'w-full' },
                createElement('i', { 'data-lucide': 'arrow-left', className: 'w-4 h-4' }), ' Back to Dashboard'
              )
            );
            break;
          default: view = HomeView();
        }
      }

      document.getElementById('app').innerHTML = '';
      document.getElementById('app').appendChild(AppLayout(view));
      lucide.createIcons();
    };

    // Initialize
    render();
  </script>
</body>
</html>
